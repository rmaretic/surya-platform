name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAIL_MAILER: array
      SSR_TEST_URL: http://127.0.0.1:13714

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl, dom, xml, curl, fileinfo, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup --no-interaction

      - name: Validate locked dependencies
        run: |
          composer validate --strict --no-check-publish
          composer check-platform-reqs

      - name: Verify demo seed on migrated MySQL database
        run: |
          php artisan migrate:status --no-interaction
          php artisan db:seed --class=LocalDemoSeeder --no-interaction
          php artisan db:seed --class=LocalDemoSeeder --no-interaction

      - name: Check local mail inbox
        run: curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18025/readyz

      - name: Frontend format lint and types
        run: |
          npm run check
          npm run types:check

      - name: PHP format and static analysis
        run: |
          composer lint:check
          composer types:check

      - name: M1 and M2 MySQL regression with live SSR
        shell: bash
        run: |
          node bootstrap/ssr/app.js > "$RUNNER_TEMP/surya-ssr.log" 2>&1 &
          ssr_pid=$!
          trap 'kill "$ssr_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 "$SSR_TEST_URL/health"
          kill -0 "$ssr_pid"
          php artisan test --compact

      - name: Repeat independent-process MySQL races
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "MySQL race repetition $attempt"
            php artisan test --compact tests/Feature/BookingConcurrencyTest.php
          done

      - name: Service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps
          docker compose logs --tail=80 mysql-testing mailpit
          if [ -f "$RUNNER_TEMP/surya-ssr.log" ]; then
            tail -80 "$RUNNER_TEMP/surya-ssr.log"
          fi

      - name: Stop CI services
        if: always()
        run: docker compose down
