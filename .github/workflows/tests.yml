name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIL_MAILER: array
      SSR_TEST_URL: http://127.0.0.1:13714

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl, dom, xml, curl, fileinfo, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup --no-interaction

      - name: Validate locked dependencies
        run: |
          composer validate --strict --no-check-publish
          composer check-platform-reqs

      - name: Verify demo seed on migrated MySQL database
        run: |
          php artisan migrate:status --no-interaction
          php artisan db:seed --class=LocalDemoSeeder --no-interaction
          php artisan db:seed --class=LocalDemoSeeder --no-interaction

      - name: Check local mail inbox
        run: curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18025/readyz

      - name: Run CI Checks
        shell: bash
        run: |
          node bootstrap/ssr/app.js > "$RUNNER_TEMP/surya-ssr.log" 2>&1 &
          ssr_pid=$!
          trap 'kill "$ssr_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 "$SSR_TEST_URL/health"
          kill -0 "$ssr_pid"
          composer ci:check

      - name: Stop CI services
        if: always()
        run: docker compose down
